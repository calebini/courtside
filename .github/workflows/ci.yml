name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Apply PostgreSQL migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "create role anon nologin; create role authenticated nologin;"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260807190000_initial_game_result_slice.sql \
            -f supabase/migrations/20260807210000_game_scheduling_and_start.sql \
            -f supabase/migrations/20260808010000_forfeits_and_result_corrections.sql \
            -f supabase/migrations/20260808120000_players_and_rosters.sql
      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:integration
